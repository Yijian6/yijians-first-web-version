<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Minecraft — 觉</title>
    <link rel="preload" href="fonts/noto-serif-sc-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .mc-scene {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px var(--side-pad) 60px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #080c18 0%, #0c1024 50%, #111630 100%);
        }

        /* 星空单独一层。
           16 个光点各是一张覆盖整个场景的 radial-gradient，原来直接铺在 .mc-scene 的
           background 里，等于根图层的每一块 tile 都叠着 17 层渐变。桌面端任何 hover
           （地块 filter 过渡、导航下划线、光标翻转）一改合成层结构，被波及的 tile 就要
           把这 17 层全部重新光栅化——录像实测最大地块一次 500ms，整页画面冻住，
           光标点解冻后直接跳到最新位置。
           挪进 ::before 并提升为合成层后，星空只光栅化一次，hover 时根图层 tile 里
           只剩一层线性渐变。手机没有 hover，不做提升，省掉一张全屏纹理的显存。 */
        .mc-scene::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            pointer-events: none;
            background:
                radial-gradient(1px 1px at 7% 14%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 18% 42%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 32% 8%, rgba(255,255,255,0.55), transparent),
                radial-gradient(1px 1px at 44% 55%, rgba(255,255,255,0.25), transparent),
                radial-gradient(1.5px 1.5px at 58% 18%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 71% 62%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 83% 9%, rgba(255,255,255,0.45), transparent),
                radial-gradient(1.5px 1.5px at 12% 72%, rgba(255,255,255,0.35), transparent),
                radial-gradient(1px 1px at 51% 34%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 66% 78%, rgba(255,255,255,0.25), transparent),
                radial-gradient(1.5px 1.5px at 89% 44%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 38% 88%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 95% 22%, rgba(255,255,255,0.35), transparent),
                radial-gradient(1px 1px at 4% 56%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 76% 36%, rgba(255,255,255,0.45), transparent),
                radial-gradient(1px 1px at 24% 92%, rgba(255,255,255,0.25), transparent);
        }

        @media (hover: hover) and (pointer: fine) {
            .mc-scene::before { will-change: transform; }
        }

        .mc-scene::after {
            content: '';
            position: absolute;
            top: 12%;
            right: 10%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(240,238,210,0.12) 0%, transparent 70%);
            box-shadow: 0 0 40px 16px rgba(240,238,210,0.04);
            pointer-events: none;
        }

        .mc-sign-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .mc-sign {
            max-width: 400px;
            width: 85vw;
            padding: 24px 28px;
            background:
                repeating-linear-gradient(
                    180deg,
                    transparent 0px,
                    transparent 13px,
                    rgba(0,0,0,0.06) 13px,
                    rgba(0,0,0,0.06) 15px
                ),
                linear-gradient(180deg, #c8a96e 0%, #b89558 100%);
            border: 4px solid #4a3728;
            box-shadow:
                inset 0 2px 0 rgba(255,255,255,0.12),
                inset 0 -2px 0 rgba(0,0,0,0.08),
                0 6px 32px rgba(0,0,0,0.6);
            text-align: center;
        }

        .mc-sign p {
            font-family: var(--font-mono);
            font-size: clamp(13px, 2.5vw, 16px);
            color: #3d2b1a;
            line-height: 2.2;
            letter-spacing: 0.03em;
            margin: 0;
        }

        .mc-post {
            width: 14px;
            height: 72px;
            background: linear-gradient(90deg, #5e4128 0%, #7a5535 45%, #5e4128 100%);
            border-left: 2px solid #4a3728;
            border-right: 2px solid #4a3728;
            border-bottom: 2px solid #4a3728;
        }

        /* ===== 世界地图：俯视，一个领域一块地 =====
           换掉原来的侧视天际线。旧版把楼高绑死在文章数上（14 层 vs 1 层已经失衡，
           写到 60 篇就站不到同一条地面线上），而且横滑一屏只换来「名字 + 层数」。
           地图用二维网格消化数量，用面积档位消化规模差。

           材质语言全部沿用页面里已有的：告示牌的木色做地图框，草地/泥土的
           15+1px 方块节距做地面纹理，领域页蓝图的绿虚线做规划格。 */
        .mcm-map {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 74px;
            grid-auto-flow: row dense;
            gap: 8px;
            padding: 8px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
            /* 地图物品：木框 + 深色图面。图面上铺一层极淡的 16px 方块网格，
               地块之间露出来的缝就是「羊皮纸上的格线」，不是黑洞 */
            background-color: #0b0e17;
            background-image:
                linear-gradient(90deg, transparent calc(100% - 1px), rgba(200, 169, 110, 0.06) calc(100% - 1px)),
                linear-gradient(0deg, transparent calc(100% - 1px), rgba(200, 169, 110, 0.06) calc(100% - 1px));
            background-size: 16px 16px;
            border: 4px solid #4a3728;
            box-shadow:
                inset 0 0 0 1px rgba(200, 169, 110, 0.22),
                inset 0 2px 0 rgba(255, 255, 255, 0.04),
                0 18px 48px -12px rgba(0, 0, 0, 0.75);
        }

        /* 地块档位：尺寸看「已建 + 规划」，也就是圈下了多大的地 */
        .mcm-plot--t1 { grid-column: span 1; grid-row: span 1; }
        .mcm-plot--t2 { grid-column: span 2; grid-row: span 1; }
        .mcm-plot--t3 { grid-column: span 2; grid-row: span 2; }
        .mcm-plot--t4 { grid-column: span 3; grid-row: span 2; }

        @media (min-width: 600px) {
            .mcm-map { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 84px; gap: 10px; padding: 10px; }
        }

        @media (min-width: 900px) {
            .mcm-map { grid-auto-rows: 92px; }
            /* 桌面整体放大到 24px 节距：地面格线、方块、聚落偏移一起变，对齐关系不变。
               多写一层选择器压过下面 .mcm-plot 里的 16px 基础值 */
            .mcm-map .mcm-plot { --mcm-pitch: 24px; }
        }

        .mcm-plot {
            /* 群系配色：--mcm-ink 是方块色，--mcm-soil 是这片地的地面底色。
               地面不透明、带色相，未建的部分是「地」而不是黑。 */
            --mcm-ink: #8a9bab;
            --mcm-soil: #222933;
            /* 一个方块的节距。方块 = 节距 − 1px 缝，和草地/泥土条的 15+1 一致 */
            --mcm-pitch: 16px;
            --mcm-cell: calc(var(--mcm-pitch) - 1px);
            /* 铭牌带高度：格子层的底边停在这里，规划格不会被文字盖掉 */
            --mcm-plate: 30px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            /* 地面：横竖各一组方块缝 + 两层 45° 对角拼出的棋盘格（相邻方块深浅交替，
               MC 俯视地形就是这样），不是条纹 */
            background-color: var(--mcm-soil);
            background-image:
                linear-gradient(90deg, transparent calc(100% - 1px), rgba(0, 0, 0, 0.24) calc(100% - 1px)),
                linear-gradient(0deg, transparent calc(100% - 1px), rgba(0, 0, 0, 0.24) calc(100% - 1px)),
                linear-gradient(45deg, rgba(255, 255, 255, 0.032) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.032) 75%),
                linear-gradient(45deg, rgba(255, 255, 255, 0.032) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.032) 75%);
            background-size:
                var(--mcm-pitch) var(--mcm-pitch),
                var(--mcm-pitch) var(--mcm-pitch),
                calc(var(--mcm-pitch) * 2) calc(var(--mcm-pitch) * 2),
                calc(var(--mcm-pitch) * 2) calc(var(--mcm-pitch) * 2);
            background-position:
                0 0,
                0 0,
                0 0,
                var(--mcm-pitch) var(--mcm-pitch);
            /* 刻进图面：深色缝 + 1px 顶部高光 */
            border: 2px solid rgba(0, 0, 0, 0.6);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
            /* hover 只改亮度，不做位移：旧版建筑要靠 .mcw-hit 反向补偿才不抖光标，
               不产生位移就整套机制都不需要了 */
            transition: border-color var(--mo-short) var(--ease-arrive),
                        filter var(--mo-short) var(--ease-arrive);
            animation: mcmPlot var(--mo-ambient) var(--ease-out-expo) backwards;
        }

        .mcm-plot:hover,
        .mcm-plot:focus-visible {
            border-color: var(--mcm-ink);
            filter: brightness(1.14);
        }

        .mcm-plot:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        @keyframes mcmPlot {
            from { opacity: 0; transform: scale(0.94); }
        }

        .mcm-plot--stone  { --mcm-ink: #8a9bab; --mcm-soil: #222933; }
        .mcm-plot--forest { --mcm-ink: #a8cc88; --mcm-soil: #1c271a; }
        .mcm-plot--sand   { --mcm-ink: #d1b06a; --mcm-soil: #2a2517; }
        .mcm-plot--ocean  { --mcm-ink: #6fb0c6; --mcm-soil: #15252c; }
        .mcm-plot--nether { --mcm-ink: #d4734a; --mcm-soil: #2a1812; }

        /* 格子层：正方形方块，固定尺寸，从左上角起铺成一片聚落。列数由 JS 按格子数算。 */
        .mcm-fill {
            position: absolute;
            top: var(--mcm-pitch);
            left: var(--mcm-pitch);
            right: 0;
            bottom: var(--mcm-plate);
            display: grid;
            grid-auto-rows: var(--mcm-cell);
            gap: 1px;
            align-content: start;
            justify-content: start;
        }

        /* 规划格：和领域页的蓝图幽灵层同一种绿虚线 */
        .mcm-cell {
            width: var(--mcm-cell);
            height: var(--mcm-cell);
            background: rgba(168, 204, 136, 0.05);
            border: 1px dashed rgba(168, 204, 136, 0.32);
        }

        /* 已建方块：实色 + 斜面。左上受光、右下背光，就是 MC 方块的立体感 */
        .mcm-cell.is-built {
            background: var(--mcm-ink);
            border: none;
            box-shadow:
                inset 1px 1px 0 rgba(255, 255, 255, 0.28),
                inset -1px -1px 0 rgba(0, 0, 0, 0.42);
        }

        /* 方块噪点：MC 的材质从来不是一个平色 */
        .mcm-cell.is-built:nth-child(3n)  { filter: brightness(0.91); }
        .mcm-cell.is-built:nth-child(7n)  { filter: brightness(1.07); }
        .mcm-cell.is-built:nth-child(11n) { filter: brightness(0.96) saturate(1.15); }

        /* 铭牌带：不是黑条。地面纹理从底下透过来，只压一层往下渐深的影子 */
        .mcm-meta {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            min-height: var(--mcm-plate);
            padding: 5px 9px 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.42) 40%, rgba(0, 0, 0, 0.56) 100%);
        }

        .mcm-name {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.06em;
            line-height: 1.45;
            color: var(--white-90);
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.85);
        }

        /* 最小的地块只有一列宽，11px 会让 8 字的领域名折行，把地挤没 */
        .mcm-plot--t1 .mcm-name {
            font-size: 10px;
            letter-spacing: 0;
        }

        .mcm-plot--t1 .mcm-meta {
            padding-left: 7px;
            padding-right: 7px;
        }

        .mcm-summary {
            font-family: var(--font-body);
            font-size: 12px;
            line-height: 1.5;
            color: var(--white-60);
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.85);
        }

        /* 次要文字从群系色里取，不用灰 */
        .mcm-stat {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.08em;
            color: var(--mcm-ink);
            opacity: 0.85;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.85);
        }

        /* 最近动土：一支火把。木杆 + 火焰，火焰带光晕呼吸 */
        .mcm-torch {
            position: absolute;
            top: 12px;
            right: 10px;
            width: 3px;
            height: 9px;
            background: #5e4128;
        }

        .mcm-torch::before {
            content: '';
            position: absolute;
            left: -2px;
            top: -6px;
            width: 7px;
            height: 7px;
            background: #f2c14e;
            box-shadow:
                inset 1px 1px 0 rgba(255, 255, 255, 0.45),
                0 3px 10px 3px rgba(242, 193, 78, 0.38);
            animation: mcmTorch 2.6s ease-in-out infinite;
        }

        @keyframes mcmTorch {
            0%, 100% { box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.45), 0 3px 8px 2px rgba(242, 193, 78, 0.28); }
            50%      { box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.45), 0 4px 14px 4px rgba(242, 193, 78, 0.5); }
        }

        .mcm-plot.has-summary { --mcm-plate: 52px; }

        /* 荒了：超过 60 天没动过。整块地压暗，左上角爬一株像素藤 */
        .mcm-plot.is-stale { filter: brightness(0.7) saturate(0.8); }

        .mcm-plot.is-stale:hover { filter: brightness(0.85) saturate(0.9); }

        .mcm-vine {
            position: absolute;
            top: 6px;
            left: 8px;
            width: 4px;
            height: 4px;
            background: #6fa34a;
            box-shadow:
                0 5px 0 #5d8a3c,
                0 10px 0 #53802e,
                4px 7px 0 #5d8a3c,
                -4px 3px 0 #53802e;
        }

        /* ===== 冒险日志 ===== */
        .mcw-log {
            margin-top: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .mcw-log-title {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.3em;
            color: var(--white-30);
            margin-bottom: 4px;
        }

        .mcw-log-line {
            display: flex;
            align-items: baseline;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            text-decoration: none;
            color: var(--white-60);
            transition: color var(--mo-short) var(--ease-arrive);
        }

        .mcw-log-line:hover {
            color: var(--gold);
        }

        .mcw-log-date {
            color: var(--white-30);
            font-size: 11px;
        }

        .mcw-log-domain {
            color: var(--gold);
            font-size: 11px;
        }

        .mc-ground {
            width: 100%;
            /* 和 .mcm-map 同宽：地图板就是种在这条地上的 */
            max-width: 1100px;
            min-width: min(560px, 90vw);
            margin-top: 0;
            /* 和其他兄弟一样压在星空层之上，否则 ::before 的光点会画到地面上 */
            position: relative;
            z-index: 1;
        }

        .mcm-legend {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 18px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.12em;
            color: var(--white-30);
            position: relative;
            z-index: 1;
        }

        .mcm-key {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .mcm-key i {
            display: block;
            width: 9px;
            height: 9px;
        }

        .mcm-key--built i {
            background: var(--white-60);
            box-shadow:
                inset 1px 1px 0 rgba(255, 255, 255, 0.35),
                inset -1px -1px 0 rgba(0, 0, 0, 0.45);
        }

        .mcm-key--plan i {
            background: rgba(168, 204, 136, 0.05);
            border: 1px dashed rgba(168, 204, 136, 0.4);
        }

        .mcm-key--fresh i {
            width: 7px;
            height: 7px;
            background: #f2c14e;
            box-shadow:
                inset 1px 1px 0 rgba(255, 255, 255, 0.45),
                0 2px 8px 2px rgba(242, 193, 78, 0.35);
        }

        .mc-grass-top {
            height: 6px;
            background: #6fa34a;
        }

        .mc-grass {
            height: 10px;
            background:
                repeating-linear-gradient(
                    90deg,
                    #5d8a3c 0px, #5d8a3c 15px,
                    #53802e 15px, #53802e 16px
                );
        }

        .mc-dirt {
            height: 32px;
            background:
                repeating-linear-gradient(
                    90deg,
                    #8b6240 0px, #8b6240 15px,
                    #7a5535 15px, #7a5535 16px
                );
            border-bottom: 3px solid #5e4128;
        }

        .mc-back {
            margin-top: 48px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--white-60);
            text-decoration: none;
            transition: color var(--mo-short) var(--ease-arrive);
            position: relative;
            z-index: 1;
        }

        .mc-back:hover {
            color: var(--gold);
        }

        .mc-back svg {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 480px) {
            .mc-sign {
                padding: 20px 20px;
            }

            .mc-post {
                height: 56px;
            }

            .mc-scene::after {
                top: 8%;
                right: 6%;
                width: 36px;
                height: 36px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .mc-scene::before,
            .mcm-plot,
            .mcm-torch::before {
                animation: none;
            }
        }
    </style>
</head>
